button.wallet:active{transform:translateY(1px)}
.wallet.pp-low{background:#fbe2cf;border-color:#efc2a1;color:#a3542f}
.pp-debt{font-size:10px;font-weight:800;color:#fff;background:#c4553f;border-radius:999px;padding:2px 6px;margin-left:2px}
.pp-upkeep{display:flex;align-items:center;gap:6px;font-size:11px;color:#8a7a45;background:#f8f1db;border-radius:8px;padding:5px 8px;margin:6px 0 2px}
.pp-upkeep .icon{width:13px;height:13px;flex:none}
.pp-acc{display:flex;flex-direction:column;gap:10px}
.pp-acc-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pp-acc-card{background:#f6f5ec;border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pp-acc-card small{font-size:10px;color:var(--muted)}
.pp-acc-card strong{display:flex;align-items:center;gap:5px;font-size:17px;color:var(--ink)}
.pp-acc-card strong .icon{width:16px;height:16px;color:#c49a3a}
.pp-acc-card.warn{background:#fbe9dc;border-color:#efc8aa}.pp-acc-card.warn strong{color:#b0552f}
.pp-acc-card.debt{background:#f8e0da;border-color:#ebb7a9}.pp-acc-card.debt strong{color:#b2412d}
.pp-acc-alert{display:flex;gap:8px;align-items:flex-start;font-size:12px;background:#fdf1e4;color:#9a5a2e;border-radius:10px;padding:8px 10px;margin:0}
.pp-acc-alert.debt{background:#f9e3de;color:#a43f2e}
.pp-acc-alert .icon{flex:none;width:16px;height:16px;margin-top:1px}
.pp-acc-title{font-size:13px;margin:6px 0 0;color:var(--ink)}
.pp-acc-sec{border:1px solid var(--line);border-radius:10px;background:#fffef9}
.pp-acc-sec summary{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12px;cursor:pointer;list-style:none}
.pp-acc-sec summary::-webkit-details-marker{display:none}
.pp-acc-sec summary span::before{content:"\25B8";display:inline-block;margin-right:6px;color:var(--muted);transition:transform .15s}
.pp-acc-sec[open] summary span::before{transform:rotate(90deg)}
.pp-acc-sec[disabled] summary{cursor:default;color:var(--muted)}.pp-acc-sec[disabled] summary span::before{visibility:hidden}
.pp-acc-sec table{width:100%;border-collapse:collapse;font-size:11px;margin:0 0 6px}
.pp-acc-sec td{padding:3px 10px 3px 22px;color:#5d6656}.pp-acc-sec td:last-child{text-align:right;padding-right:10px}
.pp-acc-total{display:flex;justify-content:space-between;font-size:13px;padding:4px 10px;font-weight:700;color:var(--ink)}
.pp-acc-scroll{overflow-x:auto}
.pp-acc-hist{width:100%;border-collapse:collapse;font-size:11px}
.pp-acc-hist th{font-weight:600;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.pp-acc-hist td{text-align:right;padding:4px 6px;border-bottom:1px solid #f0f0e6;white-space:nowrap}
.pp-acc-hist th:first-child,.pp-acc-hist td:first-child{text-align:left}
.pp-acc-hist tr.today td{background:#f6f8ef}
.pp-acc-hist .pos{color:#4b7a46}.pp-acc-hist .neg{color:#b2533f}
.pp-note{font-size:11px;color:var(--muted);line-height:1.45;margin:4px 0}
.pp-file-line{display:flex;gap:8px;align-items:center;font-size:12px;background:#f6f5ec;border-radius:10px;padding:9px 11px;margin:0 0 12px;word-break:break-all}
.pp-file-line .icon{flex:none;width:16px;height:16px;color:var(--green)}
.pp-file-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pp-file-grid .btn{justify-content:center}
.pp-file-card{display:flex;gap:10px;align-items:center;background:#f6f5ec;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pp-file-card .icon{width:22px;height:22px;color:var(--green);flex:none}
.pp-file-card strong{display:block;word-break:break-all}.pp-file-card small{color:var(--muted);font-size:11px}
.pp-name{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;margin-bottom:6px}
.pp-name input{font:inherit;font-weight:500;padding:9px 11px;border:1px solid #d6dacb;border-radius:10px;background:#fff;color:var(--ink)}
.pp-name input:focus{outline:2px solid #9cc28a;border-color:transparent}
.button-row.pp-col{flex-direction:column;align-items:stretch}
.pp-stop-file{font-size:12px;color:#5c7a4f;background:#eef4e4;border-radius:10px;padding:6px 10px;word-break:break-all}
.pp-stop-more{margin-top:-2px}
.save-load-buttons{grid-template-columns:repeat(3,minmax(0,1fr))}
.save-load-buttons .btn{padding-left:6px;padding-right:6px;font-size:11px}
body:has(.pp-stop) .modal-overlay{z-index:240}
.toasts{z-index:260}
@media (max-width:520px){.pp-acc-cards{grid-template-columns:1fr 1fr}.pp-file-grid{grid-template-columns:1fr}.save-load-buttons{grid-template-columns:1fr}}
/*PP-GESTION-END*/</style></head>
